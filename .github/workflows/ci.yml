name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - run: npm install
      working-directory: ./apps/web
    - run: npm run lint
      working-directory: ./apps/web
    - run: npm run build
      working-directory: ./apps/web

  core-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - run: npm install
      working-directory: ./apps/core-api
    - run: npm run lint
      working-directory: ./apps/core-api
    - run: npm run build
      working-directory: ./apps/core-api

  ai-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - run: pip install -r requirements.txt
      working-directory: ./apps/ai-api
      # (In a real setup we should have a requirements.txt, adding a dummy step for now)
